<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code viewer</title>
    <link rel="stylesheet" href="../src/css/style.css" />
    <script src="../src/js/theme.js"></script>
    <style>
      .code {
        margin: 0;
        padding: 16px;
        overflow-x: auto;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.85rem;
        line-height: 1.5;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <div class="container">
        <div>
          <div class="site-header__label">Code of the principle</div>
          <h1 id="file-name">Code</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light/dark theme"></button>
      </div>
    </header>

    <main class="container">
      <div class="section">
        <pre class="code"><code id="code">Loading…</code></pre>
      </div>
    </main>

    <script>
      // Usage: view.html?file=../app/index.html
      var file = new URLSearchParams(location.search).get('file');
      var output = document.getElementById('code');

      if (!file) {
        output.textContent = 'No file given. Use view.html?file=path/to/file';
      } else {
        document.getElementById('file-name').textContent = file.split('/').pop();
        fetch(file)
          .then(function (response) {
            if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
            return response.text();
          })
          .then(function (text) {
            // Strip the auto-reload script that VS Code Live Server injects into HTML files
            output.textContent = text.replace(
              // ("\x3C" is "<", escaped so the HTML parser doesn't treat it as a tag)
              /\s*\x3C!-- Code injected by live-server -->\s*\x3Cscript>[\s\S]*?\x3C\/script>/,
              ''
            );
          })
          .catch(function (error) {
            output.textContent = 'Could not load ' + file + ' (' + error.message + ')';
          });
      }
    </script>
  </body>
</html>
